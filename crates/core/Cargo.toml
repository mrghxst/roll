[package]
name = "roll-core"
description = "Data model, database, scan, rules, planner, journal and jobs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
roll-meta.workspace = true
roll-media.workspace = true
roll-geo.workspace = true
roll-ai.workspace = true
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
dirs.workspace = true
image.workspace = true
keyring.workspace = true
notify.workspace = true
parking_lot.workspace = true
rayon.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ts-rs.workspace = true
walkdir.workspace = true
trash = "5.2.9"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
sha2 = "0.11.0"
sha1 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[dev-dependencies]
base64.workspace = true
parking_lot.workspace = true
sha1 = "0.11.0"
memory-stats = "1.2.0"
roll-media.workspace = true
tempfile.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }
