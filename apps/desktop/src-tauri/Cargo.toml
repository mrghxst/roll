[package]
name = "roll-desktop"
description = "Roll desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "roll_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
roll-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7.1"
