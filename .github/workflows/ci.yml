name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libimage-exiftool-perl xz-utils
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ
          echo "$PWD/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"

      - name: macOS tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg exiftool

      - name: Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install exiftool -y --no-progress
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath .
          "$PWD\ffmpeg-master-latest-win64-gpl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Rust format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Fixtures
        run: cargo run --release -p roll-fixtures
      - name: Rust tests
        run: cargo test --workspace
      - name: Bindings are current
        shell: bash
        run: git diff --exit-code -- apps/desktop/src/lib/ipc/bindings

      - name: Svelte check
        run: pnpm --filter @roll/desktop check
      - name: Unit tests
        run: pnpm --filter @roll/desktop test
      - name: Web build
        run: pnpm --filter @roll/desktop build
      - name: UI tests
        run: |
          pnpm --filter @roll/desktop exec playwright install --with-deps chromium
          pnpm --filter @roll/desktop e2e
