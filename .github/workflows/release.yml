name: Release

# Builds the installers for every platform. A `v*` tag publishes them as a
# GitHub release with SHA256SUMS; a manual run only builds them, to check.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2025
            args: --config src-tauri/tauri.bundle.json
            files: target/release/bundle/nsis/*.exe
          # 22.04 so the AppImage and deb run on older distributions too.
          - name: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            files: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
          - name: macos
            os: macos-15
            args: --target universal-apple-darwin --bundles dmg
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 xdg-utils

      - name: Windows tools to bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-tools.ps1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: apps/desktop
        run: pnpm tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: roll-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir dist
          find artifacts -type f -exec mv {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Roll ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md --prerelease
